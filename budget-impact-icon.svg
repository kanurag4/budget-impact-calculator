<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Document body -->
  <rect x="10" y="8" width="34" height="44" rx="4" stroke="#38bdf8" stroke-width="2" fill="#38bdf8" fill-opacity="0.1"/>
  <!-- Dog-ear fold -->
  <polyline points="34,8 44,18 34,18 34,8" stroke="#38bdf8" stroke-width="2" fill="#0f172a" fill-opacity="0.6"/>
  <!-- Text lines inside document -->
  <line x1="17" y1="26" x2="37" y2="26" stroke="#818cf8" stroke-width="2"/>
  <line x1="17" y1="33" x2="31" y2="33" stroke="#818cf8" stroke-width="2"/>
  <!-- Upward arrow breaking out bottom-right -->
  <polyline points="38,50 48,36 53,41" stroke="#34d399" stroke-width="2.5"/>
  <polyline points="48,36 53,31 58,36" stroke="#34d399" stroke-width="2.5"/>
  <!-- Dollar circle badge at arrow tip -->
  <circle cx="53" cy="22" r="8" stroke="#34d399" stroke-width="2" fill="#34d399" fill-opacity="0.15"/>
  <text x="53" y="26" text-anchor="middle" font-size="9" font-family="system-ui" fill="#34d399" stroke="none">$</text>
</svg>
